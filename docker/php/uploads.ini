; Custom PHP runtime settings for production uploads and image processing.
; The base php:8.4-fpm image ships with conservative defaults
; (upload_max_filesize=2M, post_max_size=8M) which silently reject or hang
; on the multi-MB gallery images uploaded through Filament/Livewire.
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
